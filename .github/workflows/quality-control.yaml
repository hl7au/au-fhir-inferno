name: quality-control

# PR gate for au-fhir-inferno. Advisory until branch protection requires it (Track B
# in docs/cicd-overhaul-plan.md — needs repo admin). Runs the existing RSpec suite,
# proves both dependency sets resolve frozen, that the static site still generates, and
# that production's image pin (deploy/prod-image.yaml) is well formed.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-control-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail if the committed lockfile doesn't match the Gemfile (no implicit updates).
  BUNDLE_FROZEN: "true"

jobs:
  quality-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby (installs the prod Gemfile, frozen)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true

      - name: Dev dependency set resolves (Gemfile.dev, frozen)
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile.dev
        run: bundle install

      # The ci-build environment's seed lock. Each kit comes from its `ci-build` branch,
      # which only ever moves forward (no force-push), so the locked commits stay
      # fetchable. A Gemfile.common change that is not relocked here fails this step rather
      # than the nightly ci-build image build.
      - name: CI-build dependency set resolves (Gemfile.ci-build, frozen)
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile.ci-build
        run: bundle install

      - name: Static site generates (Jekyll)
        run: |
          cp .env.development .env
          bundle exec rake web:generate_dev

      # The chart and its render checks live in hl7au/inferno-deployment. What remains
      # here is production's image pin, which the inferno-prod Application reads straight
      # from master as its last value file, so nothing else validates it before it ships.
      - name: Prod image pin is one immutable SHA tag (deploy/prod-image.yaml)
        run: |
          ruby -ryaml -e '
            doc = YAML.safe_load_file("deploy/prod-image.yaml")
            ok = doc.is_a?(Hash) && doc.keys == ["inferno"] &&
                 doc["inferno"].is_a?(Hash) && doc["inferno"].keys == ["imageUrl"] &&
                 doc["inferno"]["imageUrl"].to_s.match?(%r{\Aghcr\.io/hl7au/au-fhir-inferno:[0-9a-f]{40}\z})
            abort "deploy/prod-image.yaml must hold only inferno.imageUrl pinned to ghcr.io/hl7au/au-fhir-inferno:<40-hex SHA>" unless ok
          '

      # The CI recipe's loader and runner (Python stdlib only, so the runner's own
      # python3 is enough).
      - name: CI recipe scripts (docs/ci) unit tests
        run: python3 -m unittest discover -s docs/ci/tests -v

      # Boots the full Inferno app (spec_helper → migrations on sqlite :memory:), so it's
      # the heaviest check — run last so the deterministic checks above always report.
      - name: RSpec
        env:
          APP_ENV: test
        run: bundle exec rake spec
