ingress:
  hostnames:
    - inferno.sparked-fhir.com
    - inferno.hl7.org.au

redirectIngress:
  enabled: true
  hostnames:
    - dev.inferno.sparked-fhir.com
    - inferno.dev.hl7.org.au
  targetUrl: "https://inferno.hl7.org.au"

inferno:
  imageUrl: ghcr.io/hl7au/au-fhir-inferno:e2a65dcf6e9088ed5685a1e19f5f53cb0dd566f2
  # Set explicitly because prod serves TWO hostnames and the derived default would take
  # the first one, inferno.sparked-fhir.com. INFERNO_HOST is a single baked value that
  # inferno_core builds absolute session redirects from, so it has to name the canonical
  # public origin: hl7.org.au is what the site, the retired-hostname redirect above and
  # the image's own .env all point at. A session created on inferno.sparked-fhir.com
  # therefore continues on inferno.hl7.org.au, against the same backend and database.
  host: "https://inferno.hl7.org.au"
  usesWrapper: true
  # HELD AT 1.0.78. Prod stays pinned (never :latest) so promotions are explicit, but
  # this pin is now a deliberate hold rather than a lag: do not advance it without
  # reading docs/issues/validator-wrapper-1079-terminology-regression.md.
  #
  # 1.0.79 upgrades org.hl7.fhir.core 6.9.7 -> 6.9.11, which replaces the terminology
  # cache-id protocol: the client probes for a server-advertised $cache-control
  # operation and, when absent, stops sending cache ids rather than falling back to the
  # old client-generated ones. tx.dev.hl7.org.au is Ontoserver 6.25.2 and does not
  # advertise $cache-control, so from 1.0.79 server-side terminology caching is off for
  # us. Measured conc=10 mean on one node: 1.0.78 2.58s, 1.0.79 4.82s, 1.0.81 4.91s,
  # confirmed by a full version crossover across two node types.
  #
  # Retained rationale for being on 1.0.78 rather than older: it carries the
  # ReentrantLock + 5-min cooldown around the heap-pressure engine reload that 1.0.68
  # lacked (1.0.68 rebuilt the whole ValidationService, wiping the session cache, on ANY
  # request seeing free heap under the ~238MB default threshold, with no cooldown).
  # VALIDATOR_OPTIMIZATION.md §10 now pins that threshold to 10MB outright.
  validatorImageUri: markiantorno/validator-wrapper:1.0.78

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# PROD ONLY, and temporary. The chart default is now enabled: false, because the static
# site and the /suites -> /test-kits redirects ship in the application image. Prod cannot
# take that default yet: this chart renders from master on merge while inferno.imageUrl
# above is pinned and only advances on a promotion PR, so between the two prod would run
# an image with no static site behind a chart with nothing serving one, and the landing
# page would 404.
#
# Remove this block, along with the nginx templates, sidecar and image build, in the
# follow-up change once the promotion above lands an image containing _site.
nginx:
  enabled: true
  platformImageUri: ghcr.io/hl7au/au-fhir-inferno:e2a65dcf6e9088ed5685a1e19f5f53cb0dd566f2-nginx


externalSecrets:
  enabled: true
  roleArn: arn:aws:iam::471112546300:role/prod-inferno-external-secrets-sa
  secretArn: arn:aws:secretsmanager:ap-southeast-2:471112546300:secret:rds!db-4a252b41-3b6b-475b-9b8c-161589839fe3-QZ8sT1
  username: postgres
  region: ap-southeast-2

postgresql:
  externaldbhost: prod-inferno-postgresql.creaskuwcgs3.ap-southeast-2.rds.amazonaws.com
  global:
    postgresql:
      auth:
        database: inferno

# Cap voluntary disruption (Karpenter consolidation, node drain) to one pod at a time
# for each replicated workload: worker and nginx run 2 replicas and inferno-app
# autoscales 1 to 6. maxUnavailable of 1 is permissive at 1 replica and protective above
# it, and never blocks consolidation. inferno-redis and validator-api are deliberately
# omitted: they are singletons whose protection is on-demand pinning, not a no-op PDB.
#
# redirect-nginx is gone: the old-hostname 301 is now a Gateway API RequestRedirect
# filter on the HTTPRoute, so there is no pod left to protect. nginx-app follows it in
# the change that removes the nginx layer from prod.
podDisruptionBudgets:
  - app: inferno-app
  - app: inferno-worker
  - app: nginx-app

healthProbes:
  # Prod pins inferno.imageUrl to a promoted SHA that predates the /healthz endpoints and
  # scripts/sidekiq_health.rb, so probing them here fails every new pod. Flip this to true
  # in the same PR that promotes prod to an image containing them.
  enabled: false
