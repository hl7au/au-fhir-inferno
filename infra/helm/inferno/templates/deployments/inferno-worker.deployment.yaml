apiVersion: apps/v1
kind: Deployment
metadata:
  name: inferno-worker
  namespace: {{ .Release.Namespace }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.inferno.workerReplicas | default 2 }}
  selector:
    matchLabels:
      app: inferno-worker
  template:
    metadata:
      labels:
        app: inferno-worker
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        {{- with .Values.capacityType }}
        karpenter.sh/capacity-type: {{ . }}
        {{- end }}
      containers:
      - name: inferno-worker
        image: {{ .Values.inferno.imageUrl }}
        command: ["bundle", "exec", "sidekiq", "-r", "./worker.rb"]
        imagePullPolicy: Always
        env:
        - name: OTEL_SERVICE_NAME
          value: "inferno-worker"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://k8s-monitoring-alloy-metrics.monitoring.svc:4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        envFrom:
        - configMapRef:
            name: inferno
        - configMapRef:
            name: postgresql-configmap
        - secretRef:
            name: postgresql-secret
        # Sidekiq serves no HTTP, so these are exec probes over its own Redis heartbeat
        # (see scripts/sidekiq_health.rb). Without them a worker that exits or wedges is
        # never restarted and the pod still reports Ready. The script exits 0 when Redis
        # is unreachable, so a Redis outage cannot turn into a worker restart loop.
        # startupProbe covers boot, which loads every test kit.
        startupProbe:
          exec:
            command: ["bundle", "exec", "ruby", "scripts/sidekiq_health.rb"]
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30   # up to 5 min to finish loading test kits
        livenessProbe:
          exec:
            command: ["bundle", "exec", "ruby", "scripts/sidekiq_health.rb"]
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["bundle", "exec", "ruby", "scripts/sidekiq_health.rb"]
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 2
        resources:
          requests:
            # Sparked event (07-01..09): the worker climbs and plateaus (Sidekiq
            # retained heap, never released to the OS), reaching ~954Mi (prod) and
            # ~805Mi (dev) and holding for ~2 days at 93% of the old 1Gi limit
            # (44h above 80%). Not an unbounded leak, but no headroom. VPA 1168Mi.
            memory: "768Mi"  # was 512Mi; steady plateau ~954Mi
            cpu: "500m"       # actual usage <10m, peaks at 352m
          limits:
            memory: "1536Mi"  # was 1Gi; clears the ~954Mi plateau
            cpu: "1000m"