apiVersion: apps/v1
kind: Deployment
metadata:
  name: inferno-app
  namespace: {{ .Release.Namespace }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.inferno.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app: inferno-app
  template:
    metadata:
      labels:
        app: inferno-app
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        {{- with .Values.capacityType }}
        karpenter.sh/capacity-type: {{ . }}
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.nginx.enabled }}
      volumes:
        - name: examplenginx-config
          configMap:
            name: nginx-config
            items:
              - key: nginx.conf
                path: nginx.conf
      {{- end }}
      initContainers:
      - name: run-migrations
        image: {{ .Values.inferno.imageUrl }}
        imagePullPolicy: Always
        command: ["bundle", "exec", "rake", "db:migrate"]
        env:
          - name: TX_SERVER_URL
            value: {{ .Values.inferno.terminologyServer }}
        envFrom:
        - configMapRef:
            name: inferno
        - configMapRef:
            name: postgresql-configmap
        - secretRef:
            name: postgresql-secret
      containers:
      - name: inferno-app
        image: {{ .Values.inferno.imageUrl }}
        imagePullPolicy: Always
        ports:
          - containerPort: 4567
        env:
          - name: TX_SERVER_URL
            value: {{ .Values.inferno.terminologyServer }}
          # Distinct service name from inferno-worker so the two workloads are separable in
          # Tempo. config.ru only configures the SDK when the endpoint is set, so unsetting
          # these disables tracing for this container.
          - name: OTEL_SERVICE_NAME
            value: "inferno-app"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://k8s-monitoring-alloy-metrics.monitoring.svc:4318"
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: "http/protobuf"
        envFrom:
        - configMapRef:
            name: inferno
        - configMapRef:
            name: postgresql-configmap
        - secretRef:
            name: postgresql-secret
        {{- if .Values.healthProbes.enabled }}
        # Gated on healthProbes.enabled because these endpoints ship in the application
        # image, and inferno.imageUrl is pinned per environment and promoted separately
        # from this chart. An environment on an image without them fails every new pod's
        # startup probe and wedges the rollout. See values.yaml.
        #
        # Liveness is dependency-free (/healthz/live) so a slow or absent database can
        # never trigger a restart loop. Readiness does a real database round trip
        # (/healthz/ready): when Postgres is rescheduled the pooled connections all die
        # and every request 500s with PG::ConnectionBad, which a liveness-only check
        # cannot see. failureThreshold is generous because booting Inferno loads every
        # test kit, and startupProbe covers that window so liveness never fires early.
        startupProbe:
          httpGet:
            path: /healthz/live
            port: 4567
          periodSeconds: 5
          failureThreshold: 60   # up to 5 min to finish loading test kits
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: 4567
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 4567
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        {{- end }}
        resources:
          requests:
            # Memory right-sized from the Sparked event (07-01..09): inferno-app
            # peaked 366Mi (prod), 350Mi (dev) and 228-348Mi across ~5 preview
            # envs, vs the old 2Gi request (~5.5x over). This block is shared by
            # every env, so the saving multiplies across all preview namespaces.
            memory: "768Mi"
            cpu: "1000m"
          limits:
            memory: "1536Mi"
            cpu: "2000m"
# CPU (not memory) gates session-build latency, so it is left unchanged:
# at 512Mi and 100m CPU takes 30sec to create new session
# at 2Gi and 1000m CPU takes 9sec to create new session
      {{- if .Values.nginx.enabled }}
      - name: nginx
        image: {{ .Values.nginx.platformImageUri }}
        imagePullPolicy: Always
        ports:
          - containerPort: 80
        volumeMounts:
          - name: examplenginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
        resources:
          requests:
            memory: "32Mi"    # Actual usage: ~3Mi
            cpu: "25m"        # Actual usage: ~1m
          limits:
            memory: "64Mi"    # Nginx is very lightweight
            cpu: "50m"        # Minimal CPU needed for reverse proxy
      {{- end }}