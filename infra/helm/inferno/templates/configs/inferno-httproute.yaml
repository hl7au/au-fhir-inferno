apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inferno-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: main-gateway
      namespace: default
  hostnames:
    {{- range .Values.ingress.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hl7validatorapi
      backendRefs:
        - name: validator-api
          port: 3500
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        {{- if .Values.nginx.enabled }}
        # Deprecated branch, kept only for prod until it is promoted to an image
        # containing the static site. See the nginx block in values.yaml.
        - name: nginx
          port: 80
        {{- else }}
        # The default. The application image serves everything at /: the Jekyll landing
        # site and the /suites -> /test-kits redirects via the middlewares in config.ru,
        # Inferno's own UI, assets and API under /suites. So the app Service is the direct
        # backend, and /hl7validatorapi above is the only thing the gateway splits off.
        - name: inferno
          port: 4567
        {{- end }}
