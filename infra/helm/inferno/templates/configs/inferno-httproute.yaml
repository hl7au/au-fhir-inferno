apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inferno-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: main-gateway
      namespace: default
  hostnames:
    {{- range .Values.ingress.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hl7validatorapi
      backendRefs:
        - name: validator-api
          port: 3500
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # The application image serves everything at /: the Jekyll landing site and the
        # /suites -> /test-kits redirects via the middlewares in config.ru, and Inferno's
        # own UI, assets and API under /suites. So the app Service is the direct backend,
        # and /hl7validatorapi above is the only thing the gateway splits off.
        - name: inferno
          port: 4567
