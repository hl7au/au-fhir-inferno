apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inferno-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: main-gateway
      namespace: default
  hostnames:
    {{- range .Values.ingress.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hl7validatorapi
      backendRefs:
        - name: validator-api
          port: 3500
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        {{- if .Values.nginx.enabled }}
        - name: nginx
          port: 80
        {{- else }}
        # No nginx layer: inferno-core serves its own UI, assets, and API at /
        # (config.ru mounts Rack::Static for the assets), so the app Service is
        # the direct backend.
        - name: inferno
          port: 4567
        {{- end }}
