apiVersion: v1
kind: ConfigMap
metadata:
  name: inferno
  namespace: {{ .Release.Namespace }}
data:
  # The public origin of this environment.
  #
  # inferno_core reads INFERNO_HOST once at boot (Application['inferno_host'], defaulting
  # to http://localhost:4567) and builds ABSOLUTE redirects from it: creating a session
  # POSTs /suites/test_sessions and 302s to <INFERNO_HOST>/suites/<suite>/<session id>.
  #
  # Nothing set it here, so it came from the .env file BAKED INTO THE IMAGE, which under
  # build-once is the wrong host for most environments: the dev-flavoured image (which
  # every preview also runs) carries https://development.inferno.sparked-fhir.com, so a
  # preview creating a session sent the user to DEV. nginx hid this with proxy_redirect,
  # rewriting the Location header to the host the client actually used. With nginx gone
  # there is nothing to rewrite it, so the value has to be right at the source.
  #
  # Derived from the first ingress hostname so a new environment gets this for free, and
  # https because TLS terminates at the gateway and every hostname is served over it.
  # inferno.host overrides it where the canonical origin is not the first ingress
  # hostname.
  #
  # This is the CANONICAL origin, not a constraint on where users may be. It is what
  # inferno stamps into absolute URLs that are not tied to a request: the page's canonical
  # link and its og:/twitter: metadata. Session redirects are no longer bound to it,
  # because InfernoPlatformTemplate::RequestHostRedirects rewrites a Location on this
  # origin under /suites back onto the hostname the client actually used. So on an
  # environment serving several hostnames, a session created on a non-canonical one STAYS
  # on that hostname, exactly as it did behind nginx's proxy_redirect.
  INFERNO_HOST: {{ .Values.inferno.host | default (printf "https://%s" (first .Values.ingress.hostnames)) | quote }}
  # validator-api is a single-pod Deployment, so this plain Service has one endpoint
  # (no cross-pod session-cache thrash, auto-fails-over when the pod is replaced).
  FHIR_RESOURCE_VALIDATOR_URL: {{ default "http://validator-api:3500" .Values.inferno.externalValidatorUrl | quote }}
  REDIS_URL: {{ default "redis://inferno-redis:6379" .Values.inferno.redisUrl | quote }}
  RAILS_ENV: {{ default "production" .Values.inferno.railsEnv | quote }}
  RESULT_DURATION_ENABLED: {{ .Values.inferno.resultDuration | default false | quote }}
  # Disable inferno_core's boot-time per-suite validator-session warming
  # (config/boot/validator.rb). It validates a throwaway Patient for every suite; au_core_v100
  # and au_core_v200 get handed the same validator sessionId, which collides on the
  # validator_sessions table's unique validator_session_id index (save only handles the
  # test_suite/options/validator conflict) and the job then retries forever. The dedicated
  # validator-warmer CronJob keeps the real session hot through the actual API path instead.
  INITIALIZE_VALIDATOR_SESSIONS: {{ .Values.inferno.initializeValidatorSessions | default false | quote }}
