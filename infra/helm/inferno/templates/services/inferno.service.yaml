apiVersion: v1
kind: Service
metadata:
  name: inferno
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - name: inferno-app
      port: 4567
      targetPort: 4567
      protocol: TCP
    {{- if .Values.nginx.enabled }}
    # Port 80 targets the nginx sidecar in the inferno-app pod, which only
    # exists while the nginx layer is enabled.
    - name: nginx
      port: 80
      targetPort: 80
      protocol: TCP
    {{- end }}
  selector:
    app: inferno-app
