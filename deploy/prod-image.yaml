# The application image production runs, and nothing else.
#
# The Helm chart and every environment's sizing, hostnames and policy live outside this
# repo: the chart in hl7au/inferno-deployment, the per-environment values in
# aehrc/sparked-argo. Production's image pin stays here because releasing is an app
# concern: the prod-promotion PR (build-and-release-package.yaml) edits this file, its
# merge cuts the vX.Y.Z tag and GitHub Release (prod-release.yaml), and CODEOWNERS on
# /deploy/ is the prod review gate. The inferno-prod Application in aehrc/sparked-argo
# reads this file from master as its last value file.
#
# Keep it a single key pinned to an immutable commit SHA tag; quality-control checks that.
inferno:
  imageUrl: ghcr.io/hl7au/au-fhir-inferno:da275590632eaa7002ac2131d4000f756533c660
